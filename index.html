<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tableau de bord · RMS BATIMENT</title>
<style>body{font-family:system-ui,sans-serif;background:#efeee9;color:#23221c;display:grid;place-items:center;min-height:100vh;margin:0;padding:16px;box-sizing:border-box}
@media (prefers-color-scheme:dark){body{background:#131310;color:#ecebe5}input{background:#22211d;color:#ecebe5;border-color:#3a3934}}
.b{max-width:360px;width:100%}h2{margin:0 0 6px}label{display:block;margin:12px 0 4px;font-size:14px}
input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cfccc3;border-radius:8px;font-size:16px}
button{margin-top:16px;width:100%;padding:11px;border:0;border-radius:8px;background:#2456d6;color:#fff;font-size:16px;font-weight:600}
a{color:#2456d6;font-size:14px}#m{min-height:1.4em}@keyframes brille{0%{background-position:-200px 0}100%{background-position:calc(200px + 100%) 0}}.sk{margin:18px auto 0;max-width:420px}.sk i{display:block;height:14px;border-radius:7px;margin:10px 0;background:linear-gradient(90deg,#e6e8f0 25%,#f3f4f9 37%,#e6e8f0 63%);background-size:200px 100%;animation:brille 1.3s infinite linear}.sk i:nth-child(2){width:80%}.sk i:nth-child(3){width:55%}</style></head>
<body><div class="b"><h2>RMS BATIMENT</h2><p id="m">Chargement…</p>
<form id="f" hidden><label for="e">E-mail</label><input id="e" type="email" autocomplete="username" required>
<label for="p">Mot de passe</label><input id="p" type="password" autocomplete="current-password" required>
<button>Se connecter</button><p><a href="#" id="oubli">Mot de passe oublié</a></p></form></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,sendPasswordResetEmail} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getFirestore,doc,getDoc,setDoc,onSnapshot} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const CFG={"apiKey": "AIzaSyDiM9bp4f7bzo4AalKVjWHdH6kwSOB3To8", "authDomain": "robot-rms.firebaseapp.com", "projectId": "robot-rms", "storageBucket": "robot-rms.firebasestorage.app", "messagingSenderId": "204001940861", "appId": "1:204001940861:web:c51f8da3d5d9110f95a814"};
const app=initializeApp(CFG),auth=getAuth(app),db=getFirestore(app);
const m=document.getElementById('m'),f=document.getElementById('f');let fait=false;
const dire=e=>({'auth/invalid-credential':'E-mail ou mot de passe incorrect.','auth/invalid-email':'E-mail incorrect.',
  'auth/too-many-requests':'Trop d\'essais : réessayer dans quelques minutes.','auth/network-request-failed':'Pas de connexion internet.',
  'permission-denied':'Ce compte n\'a pas accès au tableau : demander à J.'})[e.code]||('Erreur : '+(e.message||e));
const pause=t=>new Promise(r=>setTimeout(r,t));
async function charger(){m.innerHTML='Chargement du tableau…<div class="sk"><i></i><i></i><i></i></div>';
  let meta,parts=[];
  for(let i=0;i<4;i++){   // le robot écrit les morceaux puis meta : on attend que tous les morceaux soient de la même version
    meta=(await getDoc(doc(db,'tableau','meta'))).data();
    if(!meta)throw new Error('le robot n\'a encore rien envoyé');
    parts=await Promise.all([...Array(meta.parts)].map((_,k)=>getDoc(doc(db,'tableau','part'+k)).then(s=>s.data())));
    if(parts.every(p=>p&&p.v===meta.v))break;await pause(3000)}
  const bin=Uint8Array.from(atob(parts.map(p=>p.z).join('')),c=>c.charCodeAt(0));
  const [dat,mod]=await Promise.all([new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text(),
    fetch('modele.html',{cache:'no-store'}).then(r=>r.text())]);
  const ref=doc(db,'partage','coches');
  window.__fb={v:meta.v,qui:()=>(auth.currentUser||{}).email||'',sortir:()=>signOut(auth).then(()=>location.reload()),
    ecrire:c=>setDoc(ref,{c},{merge:true}),
    ecouter:(cb,err)=>onSnapshot(ref,s=>cb((s.data()||{}).c||{}),err),
    meta:cb=>onSnapshot(doc(db,'tableau','meta'),s=>cb(s.data()||{}),()=>{}),
    vie:cb=>onSnapshot(doc(db,'tableau','vie'),s=>cb(s.data()||{}),()=>{}),   // 23/11 : signe de vie du robot (quand, pc, tache, version, code)
    pdf:async ch=>{   // PDF copié par le robot : pdf/<sha1 du chemin> puis ses morceaux pdf/<clé>-<i>
      const k=[...new Uint8Array(await crypto.subtle.digest('SHA-1',new TextEncoder().encode(ch)))].map(x=>x.toString(16).padStart(2,'0')).join('');
      const m=(await getDoc(doc(db,'pdf',k))).data();if(!m)throw new Error('absent');
      const z=(await Promise.all([...Array(m.n)].map((_,i)=>getDoc(doc(db,'pdf',k+'-'+i)).then(s=>(s.data()||{}).z||'')))).join('');
      return new Blob([Uint8Array.from(atob(z),c=>c.charCodeAt(0))],{type:'application/pdf'})}};
  fait=true;
  const html=mod.replace('/*DATA*/null',()=>dat.split('</').join('<\\/')).replace('/*WEB*/null',()=>'{"fb":true}');
  document.open();document.write(html);document.close()}
onAuthStateChanged(auth,u=>{if(fait)return;
  if(!u){m.textContent='Connexion avec votre compte RMS BATIMENT.';f.hidden=false;return}
  f.hidden=true;charger().catch(e=>{m.textContent=dire(e);f.hidden=false})});
f.onsubmit=ev=>{ev.preventDefault();m.textContent='Connexion…';
  signInWithEmailAndPassword(auth,document.getElementById('e').value.trim(),document.getElementById('p').value).catch(e=>m.textContent=dire(e))};
document.getElementById('oubli').onclick=ev=>{ev.preventDefault();const e=document.getElementById('e').value.trim();
  if(!e){m.textContent='Taper d\'abord votre e-mail.';return}
  sendPasswordResetEmail(auth,e).then(()=>m.textContent='Un e-mail pour changer le mot de passe a été envoyé à '+e+'.').catch(x=>m.textContent=dire(x))};
</script></body></html>
